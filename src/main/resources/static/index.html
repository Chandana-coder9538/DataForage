<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DataForge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>DataForge</h1>

    <div class="container">

        <div class="panel">
            <h2>Operations</h2>
            <div id="operation-list"></div>
        </div>

        <div class="panel">
            <h2>Recipe</h2>
            <div id="recipe-list"></div>
        </div>

        <div class="panel">
            <h2>Input</h2>
            <textarea id="input-box" placeholder="Type something..."></textarea>

            <button id="bake-button">Bake</button>

            <h2>Output</h2>
            <textarea id="output-box" readonly></textarea>
        </div>

    </div>

    <!-- Learning panel: filled by explain.js after Bake -->
    <section id="explanation" class="explanation" hidden>
        <h2>How it works</h2>
        <div id="explanation-tabs" class="explanation-tabs"></div>
        <div id="explanation-body" class="explanation-body"></div>
        <div class="explanation-nav">
            <button id="explain-prev" type="button">&larr; Previous</button>
            <span id="explain-progress"></span>
            <button id="explain-next" type="button">Next &rarr;</button>
        </div>
    </section>

    <script src="Explain.js"></script>
    <script src="script.js"></script>
</body>
</html>
